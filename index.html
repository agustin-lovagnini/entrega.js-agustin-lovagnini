<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Simulador de Inversiones</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script> <!-- Biblioteca Toastify -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> <!-- Biblioteca SweetAlert2 -->
    <script src="script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <!-- Pantalla inicial -->
    <section id="pantalla-inicio">
        <div class="bienvenida-contenido">
            <h1>¡Bienvenido a SA, simulador!</h1>
            <input type="text" id="nombreUsuario" placeholder="Ingresá tu nombre">
            <p id="errorNombre" class="error"></p>
            <button id="btnIngresar">Ingresar</button>
        </div>
    </section>

    <!-- Panel general -->
    <section id="panel-general" style="display: none;">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar" style="display: none;">
            <div class="sidebar-header">
                <button id="toggleSidebar" class="material-icons">double_arrow</button>
                <button id="closeSidebar" class="material-icons" style="display: none;">close</button>
            </div>
            <div class="logo-sa">SA</div>
            <ul>
                <li>
                    <span class="material-icons">home</span>
                    <a href="#" id="btnInicio" class="item-text">Inicio</a>
                </li>
                <li>
                    <span class="material-icons">add_circle</span>
                    <a href="#" id="btnNuevaInversionSidebar" class="item-text">Nueva Inversión</a>
                </li>
                <li>
                    <span class="material-icons">history</span>
                    <a href="#" id="btnVerHistorial" class="item-text">Ver Historial</a>
                </li>
                <li>
                    <span class="material-icons">logout</span>
                    <a href="#" id="btnCerrarSesion" class="item-text">Cerrar Sesión</a>
                </li>
            </ul>
        </aside>

        <div class="contenido">
            <!-- Saludo centrado arriba -->
            <div class="contenedor-saludo-saldo">
                <div class="contenedor-saludo">
                    <h2 id="saludo" class="no-seleccionar"></h2>
                </div>

                <div class="contenedor-saldo">
                    <p class="texto-saldo">Tu saldo en pesos es:</p>
                    <p class="monto-saldo" id="saldoPesos">$ 0,00</p>
                    <button id="btnCargarSaldo">Ingresar dinero</button>
                </div>
            </div>

            <!-- Dos contenedores lado a lado -->
            <div class="contenedor-principal">
                <!-- Contenedor izquierdo: Formulario -->
                <div class="contenedor-izquierdo">
                    <h3>Movimientos</h3>

                    <!-- INVERTIR -->
                    <button id="btnNuevaInversion">Hacer nueva inversión</button>
                    <!-- Formulario de inversión -->
                    <div id="formInversion">
                        <input type="text" id="monto" placeholder="Monto a invertir" inputmode="numeric"
                            pattern="[0-9]*">
                        <select id="moneda">
                            <option value="0">USDT</option>
                            <option value="1">USDS</option>
                            <option value="2">BTS</option>
                            <option value="3">Ethereum</option>
                        </select>
                        <p id="errorMonto" class="error"></p>
                        <hr class="linea-separadora">
                        <button id="btnGuardarInversion">Guardar inversión</button>
                    </div>

                    <!-- RETIRAR DINERO -->
                    <button id="btnRetirar">Retirar dinero</button>
                    <!-- Formulario de retiro -->
                    <div id="formRetiro">
                        <input type="text" id="montoRetiro" placeholder="Monto a retirar" inputmode="numeric"
                            pattern="[0-9]*">
                        <select id="monedaRetiro">
                            <option value="0">USDT</option>
                            <option value="1">USDS</option>
                            <option value="2">BTS</option>
                            <option value="3">Ethereum</option>
                        </select>
                        <p id="errorMontoRetiro" class="error"></p>
                        <hr class="linea-separadora">
                        <button id="btnGuardarRetiro">Confirmar retiro</button>
                    </div>
                </div>

                <!-- Contenedor derecho: Resumen -->
                <div class="contenedor-derecho">
                    <h3>Tus inversiones</h3>
                    <ul id="listaInversiones"></ul>
                </div>
            </div>

            <!-- Sección Historial de Transacciones -->
            <div id="historialSection" style="display: none;">
                <div class="historial-header">
                    <h2>Historial de Transacciones</h2>
                    <button id="btnVolverInicio" onclick="volverAlInicio()">Volver</button>
                </div>
                <div id="listaHistorial" class="lista-historial"></div>
            </div>
        </div>
    </section>
</body>

</html>
